[package]
name = "weft-cli"
description = "The weft command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
clap.workspace = true
miette = { workspace = true, features = ["fancy"] }
serde.workspace = true
serde_yaml_ng.workspace = true
weft-check = { path = "../weft-check" }
weft-codegen = { path = "../weft-codegen" }
weft-syntax = { path = "../weft-syntax" }

[lints]
workspace = true
