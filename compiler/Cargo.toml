[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/weft-sdk/weft"
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
chumsky = "0.9"
insta = "1"
jsonschema = "0.62"
miette = "7"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
