name: Feature request
description: An idea for Weft
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Weft makes hard?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: How you imagine it working. A contract or code sketch helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
