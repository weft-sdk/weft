name: go

on:
  push:
    branches: [main]
    paths: ["go/**", "spec/**", "sdks/typescript/docker-compose.yaml", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go/**", "spec/**", "sdks/typescript/docker-compose.yaml", ".github/workflows/go.yml"]

  # A weekly run on every system (macOS included), and a manual one: macOS minutes cost ten times as much,
  # so it is not run for every change.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch makes an older, unfinished run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows for every change; macOS only for the weekly and manual runs.
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  kafka:
    # The Kafka adapter against a real broker. Linux only: the runners for the others have no Docker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - run: docker compose --file sdks/typescript/docker-compose.yaml up -d --wait
      - run: go test -race ./kafka/... ./e2e/...
        working-directory: go
        env:
          WEFT_TEST_KAFKA: 127.0.0.1:9092
      - if: failure()
        run: docker compose --file sdks/typescript/docker-compose.yaml logs kafka | tail -50
