name: compiler

on:
  push:
    branches: [main]
    paths: ["compiler/**", ".github/workflows/compiler.yml"]
  pull_request:
    paths: ["compiler/**", ".github/workflows/compiler.yml"]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components; rustup installs them on first use.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
