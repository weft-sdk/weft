name: compiler

on:
  push:
    branches: [main]
    paths: ["compiler/**", "spec/**", "sdks/typescript/packages/e2e/src/weft.gen.ts", "go/e2e/weft.gen.go", ".gitattributes", ".github/workflows/compiler.yml"]
  pull_request:
    paths: ["compiler/**", "spec/**", "sdks/typescript/packages/e2e/src/weft.gen.ts", "go/e2e/weft.gen.go", ".gitattributes", ".github/workflows/compiler.yml"]

  # A weekly run on every system (macOS included), and a manual one: macOS minutes cost ten times as much,
  # so it is not run for every change.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch makes an older, unfinished run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows for every change; macOS only for the weekly and manual runs.
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: compiler
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version and components; rustup installs them on first use.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # The code generator tests type-check its output with tsc, so TypeScript must be installed. On Linux a missing
      # tsc fails the tests; on the other systems those tests skip, to keep the matrix quick.
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
      - run: npm install --global typescript@5.9
        if: runner.os == 'Linux'
      - run: cargo test --locked
        env:
          WEFT_REQUIRE_TSC: ${{ runner.os == 'Linux' && '1' || '' }}
      - run: cargo build --locked
