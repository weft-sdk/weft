name: conformance

on:
  push:
    branches: [main]
    paths: ["conformance/**", "compiler/**", "sdks/typescript/**", "go/**", "spec/**", ".github/workflows/conformance.yml"]
  pull_request:
    paths: ["conformance/**", "compiler/**", "sdks/typescript/**", "go/**", "spec/**", ".github/workflows/conformance.yml"]

permissions:
  contents: read

jobs:
  cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.mod
      - run: pnpm install --frozen-lockfile
        working-directory: sdks/typescript
      - run: pnpm build
        working-directory: sdks/typescript
      # The harness's own tests, including the one that drives the real TypeScript runner.
      - run: cargo test --locked -p weft-conformance
        working-directory: compiler
        env:
          WEFT_REQUIRE_RUNNERS: "1"
      # Everything, with a real Kafka broker for the cross-language cases. The table that comes out must be
      # the committed one: `make conformance-table` regenerates it.
      - run: docker compose --file sdks/typescript/docker-compose.yaml up -d --wait
      - run: cargo run --locked -p weft-conformance -- run --require-infra --results ../conformance-results.json --table ../conformance/compatibility.md
        working-directory: compiler
        env:
          WEFT_TEST_KAFKA: 127.0.0.1:9092
      - run: git diff --exit-code conformance/compatibility.md
      - if: failure()
        run: docker compose --file sdks/typescript/docker-compose.yaml logs kafka | tail -40
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-results
          path: conformance-results.json
