name: typescript

on:
  push:
    branches: [main]
    paths: ["sdks/typescript/**", "spec/**", ".github/workflows/typescript.yml"]
  pull_request:
    paths: ["sdks/typescript/**", "spec/**", ".github/workflows/typescript.yml"]

  # A weekly run on every system (macOS included), and a manual one: macOS minutes cost ten times as much,
  # so it is not run for every change.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch makes an older, unfinished run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows for every change; macOS only for the weekly and manual runs.
        os: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # What would be published: the tarballs must pack, with the files the runbook lists.
      - run: pnpm --filter "@weft-sdk/*" exec npm pack --dry-run

  kafka:
    # The Kafka adapter against a real broker. Linux only: the runners for the others have no Docker.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/typescript/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: sdks/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: docker compose up -d --wait
      - run: pnpm --filter @weft-sdk/kafka-kafkajs --filter weft-e2e test
        env:
          WEFT_TEST_KAFKA: 127.0.0.1:9092
      - if: failure()
        run: docker compose logs kafka | tail -50
