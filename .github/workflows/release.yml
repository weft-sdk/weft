name: release

# Builds the `weft` binary for every system. Push a tag like `v0.1.0` to publish a GitHub release with the files
# attached. Run it by hand (Actions › release › Run workflow) to only build them, which publishes nothing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, archive: tar.gz }
          # Built on Apple silicon: macos-13, the last Intel runner, is retired. It cannot run its own result, so no smoke test.
          - { target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz, smoke: false }
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: compiler
          key: ${{ matrix.target }}
      # The toolchain is pinned by compiler/rust-toolchain.toml, so the target is added for that one.
      - name: Add the target
        working-directory: compiler
        run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: compiler
        run: cargo build --release --locked -p weft-cli --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="weft-${{ matrix.target }}"
          mkdir "$name"
          cp compiler/target/${{ matrix.target }}/release/weft "$name/"
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          (command -v sha256sum >/dev/null && sha256sum "$name.tar.gz" || shasum -a 256 "$name.tar.gz") > "$name.tar.gz.sha256"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "weft-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "compiler/target/${{ matrix.target }}/release/weft.exe" $name
          Copy-Item LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - name: Smoke test (runs the binary that was built)
        if: matrix.smoke != false
        shell: bash
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            compiler/target/${{ matrix.target }}/release/weft.exe --version
          else
            compiler/target/${{ matrix.target }}/release/weft --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: weft-${{ matrix.target }}
          path: |
            weft-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    name: publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Weft ${GITHUB_REF_NAME}" \
            --generate-notes
